name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ── Build + Lint + Typecheck (single job, runs once) ──────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── TUI end-to-end (needs a real terminal: tmux drives a private pty) ──
  tui-e2e:
    name: TUI E2E
    needs: build
    # Runs headless: scripts/tui-e2e.mjs strips CI / CONTINUOUS_INTEGRATION / CI_*
    # from the tmux session env, because Ink (is-in-ci) paints only the FINAL
    # frame in CI mode — without that, every scenario would watch a blank pane.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Build
        run: npm run build

      - name: Run TUI end-to-end scenarios
        run: npm run verify:tui
        env:
          # CI runners are slower to re-render between keystrokes than a local
          # machine; scripts/tui-e2e.mjs reads this settle delay.
          TUI_E2E_KEY_DELAY: '250'

  # ── Cross-platform unit & property tests ─────────────────────────────
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.x', '23.x']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Run unit and property tests
        run: npx vitest --run tests/unit tests/property

      - name: Smoke test (verify binary runs)
        run: node dist/cli.js --version

  # ── Integration tests (Linux only) ──────────────────────────────────
  integration:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Run integration tests
        run: npx vitest run tests/integration

  # ── Coverage report ─────────────────────────────────────────────────
  coverage:
    name: Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
